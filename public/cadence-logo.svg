<svg xmlns="http://www.w3.org/2000/svg" width="420" height="132" viewBox="0 0 420 132" role="img" aria-labelledby="title description">
  <title id="title">Cadence</title>
  <desc id="description">Cadence wordmark with an adaptive rhythm mark</desc>
  <defs>
    <style>
      .wordmark { fill: #111827; }
      @media (prefers-color-scheme: dark) { .wordmark { fill: #f9fafb; } }
    </style>
    <linearGradient id="cadence-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect x="8" y="14" width="104" height="104" rx="30" fill="url(#cadence-gradient)"/>
  <path d="M31 71c13 0 13-26 26-26s13 42 26 42c9 0 13-12 18-21" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="wordmark" x="136" y="86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Cadence</text>
</svg>
